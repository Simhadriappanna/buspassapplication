<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta poroperty="og:image" content="https://upload.wikimedia.org/wikipedia/en/0/05/TSRTC_LOGO.png">
    <title>TSRTC Bus Pass Application</title>
    <link rel="icon" href="./buss logo.jpeg" />
  </head>
 <center>
    <body>
    <center>
      <img src="./buss logo.jpeg" alt="TSRTC Logo" height="100px" />
      <h2 style="color: blue">
        <b>TELANGANA STATE ROAD TRANSPORT CORPORATION</b>
      </h2>
      <h2>GENERAL BUS PASS APPLICATION</h2>
    </center>

    <form action="./welcome.html">
      <fieldset>
        <legend>Applicant Details</legend>

        <label for="name">Name:</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter name"
          required
        />

        <label for="father_name">Father's/Guardian's Name:</label>
        <input
          type="text"
          id="father_name"
          name="father_name"
          required
        /><br /><br />

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required />

        <label>Gender:</label
        ><input type="radio" name="gender" id="male" value="Male" required />
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female" value="Female" required />
        <label for="female">Female</label><br /><br />

        <label>Age As on:</label>
        <input type="number" name="years" style="width: 40px" /> years
        <input type="number" name="months" style="width: 40px" /> months
        <input type="number" name="days" style="width: 40px" /> days

        <label for="aadhaar">Aadhaar No:</label>
        <input type="text" id="aadhaar" name="aadhaar" required /><br /><br />

        <label for="whatsapp">WhatsApp No:</label>
        <input type="text" id="whatsapp" name="whatsapp" required />

        <label for="email">Email ID:</label>
        <input type="email" id="email" name="email" required /><br /><br />

        <label for="photo">Photo:</label>
        <input type="file" id="photo" name="photo" required />
      </fieldset>

      <fieldset>
        <legend>Residential Address Details</legend>

        <label for="address">Applicant's Address:</label>
        <textarea
          id="address"
          name="address"
          rows="4"
          maxlength="200"
        ></textarea
        ><br /><br />

        <label for="district">District:</label>
        <select id="district" name="district">
          <option selected disabled>---Select---</option>
          <option value="Hyderabad">Hyderabad</option>
        </select>

        <label for="mandal">Mandal:</label>
        <select id="mandal" name="mandal">
          <option value="Hyderabad">Hyderabad</option>
        </select>

        <label for="village">Village:</label>
        <select id="village" name="village">
          <option value="Hyderabad">Hyderabad</option></select
        ><br /><br />

        <label for="pincode">Pincode:</label>
        <input type="text" id="pincode" name="pincode" style="width: 100px" />
      </fieldset>

      <fieldset>
        <legend>Pass Type Details</legend>

        <label for="city">City:</label>
        <select id="city" name="city">
          <option value="Hyderabad">Hyderabad</option></select
        ><br /><br />

        <label for="pass_type">Pass Type:</label>
        <select id="pass_type" name="pass_type">
          <option selected disabled>---Select---</option>
        </select>
      </fieldset>

      <fieldset>
        <legend>Mode of Payment & Pass Collection</legend>

        <label for="payment_mode">Payment Mode:</label>
        <select id="payment_mode" name="payment_mode">
          <option selected disabled>---Select---</option>
          <option value="gpay">GPay</option>
          <option value="phonepe">PhonePe</option></select
        ><br /><br />

        <label for="delivery_mode">Pass Delivery Mode:</label>
        <select id="delivery_mode" name="delivery_mode">
          <option selected disabled>---Select---</option>
          <option value="rtc_bus">RTC Travel Buses</option></select
        ><br /><br />

        <label for="collection_center"
          >Center at which you want to collect pass:</label
        >
        <select id="collection_center" name="collection_center">
          <option selected disabled>---Select---</option></select
        ><br /><br />

        <label for="captcha">Enter Captcha:</label>
        <input type="text" id="captcha" name="captcha" required /><br /><br />

        
        <img
          src="https://tgsrtcpass.com/images/reload.png"
          height="30"
          width="50"
          alt="Reload Icon"
        /><br /><br />

        <button type="submit">Submit</button>
      </fieldset>
    </form>
  </body>
  </center>
</html>
